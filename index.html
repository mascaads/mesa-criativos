<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central X1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0d1220; --bg-2:#0a0e19; --surface:#141b2c; --surface-2:#1a2338; --surface-3:#212c46;
  --border:#26314c; --border-2:#324063;
  --text:#e7ecf7; --text-2:#a3adc7; --text-3:#6c778f;
  --accent:#4f8cff; --accent-2:#3a6fd6; --accent-soft:rgba(79,140,255,.14);
  --good:#26c281; --good-soft:rgba(38,194,129,.15);
  --warn:#f0a830; --warn-soft:rgba(240,168,48,.15);
  --crit:#f2585f; --crit-soft:rgba(242,88,95,.15);
  --st-modelado:#8b93a7; --st-validado:#4f8cff; --st-pre:#f0a830; --st-escala:#26c281; --st-zona:#c9b8ff;
  --shadow:0 8px 30px -12px rgba(0,0,0,.6);
  --r:14px; --r-sm:10px;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --disp:"Sora",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
:root[data-theme="light"]{
  --bg:#eef1f7; --bg-2:#e4e8f1; --surface:#ffffff; --surface-2:#f5f7fb; --surface-3:#eaeef6;
  --border:#dde3ee; --border-2:#c7d0e0;
  --text:#131a2b; --text-2:#4d586f; --text-3:#8792a8;
  --accent:#2f6fe0; --accent-2:#2559bd; --accent-soft:rgba(47,111,224,.1);
  --good:#12996a; --good-soft:rgba(18,153,106,.12);
  --warn:#c8801a; --warn-soft:rgba(200,128,26,.12);
  --crit:#d83b43; --crit-soft:rgba(216,59,67,.1);
  --st-modelado:#7a8298; --st-validado:#2f6fe0; --st-pre:#c8801a; --st-escala:#12996a; --st-zona:#7c5ff0;
  --shadow:0 8px 24px -14px rgba(30,45,80,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px}
::selection{background:var(--accent-soft)}
a{color:inherit}

/* ---------- Layout shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--bg-2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:20px 20px 18px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),#7c6cf5);display:grid;place-items:center;font-family:var(--disp);font-weight:800;color:#fff;font-size:17px;box-shadow:0 4px 14px -4px var(--accent)}
.brand b{font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:-.02em;display:block}
.brand span{font-size:11px;color:var(--text-3);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 12px;flex:1;overflow:auto}
.nav .lbl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);padding:14px 12px 6px;font-weight:600}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:0;background:transparent;color:var(--text-2);border-radius:10px;text-align:left;font-size:13.5px;font-weight:500;transition:.13s}
.nav button svg{width:18px;height:18px;flex:none;stroke-width:1.9}
.nav button:hover{background:var(--surface);color:var(--text)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-3);background:var(--surface);padding:1px 7px;border-radius:20px}
.nav button.on .cnt{color:var(--accent)}
.side-foot{padding:12px;border-top:1px solid var(--border)}
.themebtn{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;background:var(--surface);border:1px solid var(--border);color:var(--text-2);border-radius:10px;font-size:12.5px;font-weight:500}
.themebtn:hover{border-color:var(--border-2);color:var(--text)}
.themebtn svg{width:16px;height:16px}

.main{min-width:0;display:flex;flex-direction:column}
.scrim{display:none}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:16px 30px;display:flex;align-items:center;gap:16px}
.topbar .tt{min-width:0}
.topbar h1{font-size:20px;font-weight:700}
.topbar .sub{font-size:12.5px;color:var(--text-2);margin-top:2px}
.topbar .sp{flex:1}
.view{padding:26px 30px 60px;max-width:1400px;width:100%}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);font-size:13px;font-weight:600;transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--text-3);background:var(--surface-2)}
.btn svg{width:16px;height:16px;stroke-width:2}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger:hover{border-color:var(--crit);color:var(--crit);background:var(--crit-soft)}
.iconbtn{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text-3)}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn svg{width:16px;height:16px;stroke-width:2}

/* ---------- Cards / grids ---------- */
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}
.stat .k{font-size:11.5px;color:var(--text-2);letter-spacing:.03em;text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:7px}
.stat .k svg{width:15px;height:15px}
.stat .v{font-family:var(--disp);font-size:30px;font-weight:700;margin-top:9px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .foot{font-size:12px;color:var(--text-3);margin-top:3px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.sect-h{display:flex;align-items:center;gap:12px;margin:30px 0 15px}
.sect-h:first-child{margin-top:6px}
.sect-h h2{font-size:15px;font-weight:600;letter-spacing:.02em}
.sect-h .line{flex:1;height:1px;background:var(--border)}

/* pills / badges */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.stg{border:1px solid transparent}
.tag{font-family:var(--mono);font-size:11px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:6px;white-space:nowrap}

/* ---------- BM tabs ---------- */
.bmtabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.bmtab{display:flex;align-items:center;gap:9px;padding:9px 15px 9px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-weight:600;font-size:13px;position:relative;transition:.13s}
.bmtab:hover{border-color:var(--border-2);color:var(--text)}
.bmtab.on{background:var(--surface-2);color:var(--text);border-color:var(--border-2)}
.bmtab .swatch{width:11px;height:11px;border-radius:4px;flex:none}
.bmtab .n{font-family:var(--mono);font-size:11px;color:var(--text-3);background:var(--bg);padding:1px 7px;border-radius:20px}
.bmtab.on .n{color:var(--text-2)}
.bmtab.add{color:var(--text-3);border-style:dashed}

/* oferta cards */
.ofertas{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.oferta{padding:17px 18px;cursor:pointer;transition:.14s;border-left:3px solid var(--accent);position:relative;overflow:hidden}
.oferta:hover{transform:translateY(-2px);border-color:var(--border-2)}
.oferta .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.oferta h3{font-size:16px;font-weight:600}
.oferta .nicho{font-size:12px;color:var(--text-2);margin-top:2px}
.oferta .mini{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px;margin-top:15px;padding-top:14px;border-top:1px solid var(--border)}
.oferta .mini .m{font-size:11px;color:var(--text-3)}
.oferta .mini .m b{display:block;font-family:var(--disp);font-size:17px;color:var(--text);font-weight:700;margin-bottom:1px}
.oferta .top{align-items:center}
.oferta .bar{display:flex;height:5px;border-radius:4px;overflow:hidden;margin-top:14px;background:var(--surface-2)}
.oferta .bar i{display:block}

/* ---------- Kanban ---------- */
.kbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px}
.crumb b{color:var(--text);font-family:var(--disp);font-weight:600;font-size:15px}
.crumb .sep{color:var(--text-3)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(248px,1fr);gap:14px;overflow-x:auto;padding-bottom:14px;align-items:start}
.col{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;min-height:120px}
.col.drop{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:9px;padding:13px 14px 11px;position:sticky;top:0}
.col-h .cdot{width:9px;height:9px;border-radius:3px;flex:none}
.col-h .cn{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.01em}
.col-h .cc{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-3);background:var(--surface);padding:1px 8px;border-radius:20px}
.col-body{display:flex;flex-direction:column;gap:9px;padding:2px 10px 12px;min-height:40px}
.kadd{margin:0 10px 12px;padding:8px;border:1px dashed var(--border-2);border-radius:9px;color:var(--text-3);background:transparent;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.kadd:hover{border-color:var(--accent);color:var(--accent)}
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 13px;cursor:grab;transition:.12s;border-top:2px solid var(--accent)}
.ccard:hover{border-color:var(--border-2);box-shadow:var(--shadow)}
.ccard.drag{opacity:.4}
.ccard .cname{font-weight:600;font-size:13.5px;line-height:1.35}
.ccard .cmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ccard .cfoot{display:flex;align-items:center;gap:7px;margin-top:11px;padding-top:10px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-2)}
.ccard .cfoot svg{width:13px;height:13px;color:var(--text-3);flex:none}
.ccard .cfoot>:first-child{display:inline-flex;align-items:center;gap:7px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nextbtn{margin-left:auto;flex:none;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text-2);font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;font-family:var(--sans)}
.nextbtn:hover{border-color:var(--accent);color:var(--accent)}
.emptycol{text-align:center;color:var(--text-3);font-size:12px;padding:14px 8px}
.board.tri{grid-auto-columns:minmax(230px,1fr)}
.phonesgrid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.phonecard{padding:14px 15px;display:flex;flex-direction:column;gap:12px}
.phonecard .ph-top{display:flex;align-items:center;gap:10px}
.phonecard .ph-top>svg{width:20px;height:20px;color:var(--text-2);flex:none}
.phonecard .ph-i{min-width:0;flex:1}
.phonecard .ph-i b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phonecard .ph-i span{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.phonecard .ph-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-2);border-top:1px solid var(--border);padding-top:11px}
.phonecard.free{border-style:dashed;border-color:var(--border-2)}
.phonecard.free .ph-i span{color:var(--warn)}
/* toggle switch */
.tgl{width:38px;height:22px;border-radius:20px;background:var(--surface-3);border:1px solid var(--border-2);position:relative;padding:0;transition:.15s}
.tgl span{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-3);transition:.15s}
.tgl.on{background:var(--good);border-color:var(--good)}
.tgl.on span{left:18px;background:#fff}
.ministage{background:transparent;border:1px solid var(--border);border-radius:7px;padding:4px 6px;font-size:12px;font-weight:600;font-family:var(--sans);cursor:pointer}
.ministage:hover{border-color:var(--border-2)}
tfoot td{border-top:2px solid var(--border-2);border-bottom:0;background:var(--surface-2);padding:12px 16px}
.sect-h h2 svg{width:15px;height:15px;vertical-align:-2px;margin-right:5px;color:var(--st-escala)}

/* ---------- Tables ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:.1s}
tbody tr:hover{background:var(--surface-2)}
td .nm{font-weight:600}
td .sub2{font-size:12px;color:var(--text-3);margin-top:1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.rowact{display:flex;gap:2px;justify-content:flex-end}

/* chip card grid alt */
.chips{grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.chipc{padding:16px 17px;position:relative;border-top:3px solid var(--good)}
.chipc .ch-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chipc .num{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.02em}
.chipc .op{font-size:11.5px;color:var(--text-2);margin-top:1px}
.chipc .gauge{display:flex;gap:10px;margin-top:15px}
.chipc .g{flex:1;background:var(--surface-2);border-radius:9px;padding:9px 11px;border:1px solid var(--border)}
.chipc .g .gl{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.chipc .g .gv{font-family:var(--disp);font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.chipc .g .gu{font-size:10.5px;color:var(--text-3)}
.chipc .ch-foot{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-2)}
.chipc .ch-foot svg{width:14px;height:14px;color:var(--text-3)}

/* prompts */
.prompts{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.promptc{padding:16px 17px;display:flex;flex-direction:column;gap:11px}
.promptc .p-top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.promptc h3{font-size:14.5px;font-weight:600}
.promptc .body{font-size:12.5px;color:var(--text-2);line-height:1.55;white-space:pre-wrap;max-height:120px;overflow:hidden;position:relative;font-family:var(--mono);background:var(--bg-2);border:1px solid var(--border);border-radius:9px;padding:11px 12px}
.promptc .body.open{max-height:none}
.promptc .fade{position:absolute;left:0;right:0;bottom:0;height:38px;background:linear-gradient(transparent,var(--bg-2))}
.promptc .p-act{display:flex;gap:7px;align-items:center}

/* empty state */
.empty{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty .ico{width:52px;height:52px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;margin:0 auto 16px}
.empty .ico svg{width:24px;height:24px;color:var(--text-3)}
.empty h3{color:var(--text-2);font-size:16px;font-weight:600;margin-bottom:6px}
.empty p{font-size:13px;max-width:340px;margin:0 auto 18px}

.seedbanner{display:flex;align-items:center;gap:12px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);color:var(--text);border-radius:12px;padding:11px 15px;margin-bottom:20px;font-size:13px}
.seedbanner svg{width:18px;height:18px;color:var(--warn);flex:none}
.seedbanner .sp{flex:1}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,9,17,.62);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--border-2);border-radius:18px;width:100%;max-width:520px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.modal-h{display:flex;align-items:center;gap:12px;padding:20px 22px 14px}
.modal-h h3{font-size:17px;font-weight:700}
.modal-h .sp{flex:1}
.modal-b{padding:4px 22px 8px;display:flex;flex-direction:column;gap:15px}
.modal-f{padding:16px 22px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border);margin-top:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.01em}
.field label .opt{color:var(--text-3);font-weight:400}
.field input,.field select,.field textarea{background:var(--bg-2);border:1px solid var(--border-2);color:var(--text);border-radius:10px;padding:10px 12px;width:100%;transition:.12s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{resize:vertical;min-height:90px;font-family:var(--mono);font-size:12.5px;line-height:1.5}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:8px;border:2px solid transparent}
.swatches button.on{border-color:var(--text);box-shadow:0 0 0 2px var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:11px;font-weight:600;font-size:13px;z-index:200;box-shadow:0 10px 30px -8px rgba(0,0,0,.5);animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:60;width:236px;transform:translateX(-100%);transition:.2s;height:100%}
  .side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.5)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;display:none}
  .scrim.on{display:block}
  .menubtn{display:grid!important}
  .topbar,.view{padding-left:18px;padding-right:18px}
  .frow{grid-template-columns:1fr}
}
.menubtn{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* conta / sync */
.acctbox{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--surface)}

/* ---------- store ---------- */
const KEY="central_x1_v1";
let DB=load();
function load(){
  try{const r=localStorage.getItem(KEY);if(r)return normalize(JSON.parse(r));}catch(e){}
  return normalize(seed());
}
function normalize(db){
  (db.criativos||[]).forEach(c=>{
    if(c.ativo===undefined)c.ativo=true;
    if(c.orcamento===undefined)c.orcamento=0;
    if(c.moeda===undefined)c.moeda="BRL";
    if(c.objetivo===undefined)c.objetivo="engj";
    if(c.qtdCampanhas===undefined)c.qtdCampanhas=1;
  });
  (db.celulares||[]).forEach(c=>{if(c.ofertaId===undefined)c.ofertaId=null;});
  return db;
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function save(){saveLocal();pushCloudDebounced();}

/* ---------- routing ---------- */
const VIEWS=[
  {id:"overview",nome:"Visão Geral",ico:"grid",sub:"O estado da operação num relance"},
  {id:"ofertas",nome:"BMs & Ofertas",ico:"layers",sub:"Suas BMs, ofertas e o funil de criativos"},
  {id:"celulares",nome:"Celulares",ico:"phone",sub:"Aparelhos rodando, em descanso e reserva"},
  {id:"chips",nome:"Chips",ico:"chip",sub:"Cadastro, recarga e aquecimento dos chips"},
  {id:"prompts",nome:"Prompts",ico:"prompt",sub:"Sua biblioteca de prompts salvos"},
];
let route="overview";
let curBM=null; // null = todas as BMs
let openOferta=null;
let promptFilter="Todos";

function go(r){route=r;openOferta=null;render();window.scrollTo(0,0);}

/* ---------- render shell ---------- */
function renderNav(){
  const counts={overview:"",ofertas:DB.ofertas.length,celulares:DB.celulares.length,chips:DB.chips.length,prompts:DB.prompts.length};
  $("#nav").innerHTML=`<div class="lbl">Operação</div>`+VIEWS.map(v=>`
    <button class="${route===v.id?"on":""}" data-go="${v.id}">${svg(v.ico)}<span>${v.nome}</span>${counts[v.id]!==""?`<span class="cnt">${counts[v.id]}</span>`:""}</button>`).join("");
  $("#nav").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{go(b.dataset.go);closeSide();});
}
function renderTheme(){
  const light=document.documentElement.getAttribute("data-theme")==="light";
  $("#theme").innerHTML=`${svg(light?"moon":"sun")}<span>Tema ${light?"escuro":"claro"}</span>`;
}
function render(){
  const v=VIEWS.find(x=>x.id===route);
  $("#vt").textContent=route==="ofertas"&&openOferta?byId(DB.ofertas,openOferta)?.nome||v.nome:v.nome;
  $("#vs").textContent=v.sub;
  renderNav();
  const R={overview:vOverview,ofertas:vOfertas,celulares:vCelulares,chips:vChips,prompts:vPrompts}[route];
  R();
}
const byId=(arr,id)=>arr.find(x=>x.id===id);

/* ---------- helpers for views ---------- */
function stagePill(id){const e=ESTG[id];return `<span class="pill stg" style="color:var(${e.cor});background:color-mix(in srgb,var(${e.cor}) 15%,transparent)"><span class="dot"></span>${e.nome}</span>`;}
function statusPill(map,id){const s=map[id]||{l:id,c:"--text-3"};return `<span class="pill" style="color:var(${s.c});background:color-mix(in srgb,var(${s.c}) 15%,transparent)"><span class="dot"></span>${s.l}</span>`;}
function celName(id){const c=byId(DB.celulares,id);return c?c.nome:null;}
function topActions(html){$("#topact").innerHTML=html;}

/* ======================= OVERVIEW ======================= */
function vOverview(){
  topActions(`<button class="btn pri" id="qa">${svg("plus")}Novo criativo</button>`);
  const c=DB.criativos;
  const emEscala=c.filter(x=>x.estagio==="escala").length;
  const rodando=DB.celulares.filter(x=>x.status==="rodando").length;
  const chipAlerta=DB.chips.filter(x=>x.status!=="banido"&&daysBetween(x.ultimaRecargaEm)>=14).length;
  const byStage=ESTAGIOS.map(e=>({e,n:c.filter(x=>x.estagio===e.id).length}));
  const totalC=c.length||1;
  const recent=[...c].sort((a,b)=>b.criadoEm-a.criadoEm).slice(0,5);
  const chipsSort=[...DB.chips].filter(x=>x.status!=="banido").sort((a,b)=>daysBetween(b.ultimaRecargaEm)-daysBetween(a.ultimaRecargaEm)).slice(0,4);

  $("#view").innerHTML=`
    ${DB._seed?seedBanner():""}
    <div class="grid stats" style="margin-bottom:22px">
      ${stat("bolt","Criativos em escala",emEscala,`de ${c.length} criativos no total`)}
      ${stat("phone","Celulares rodando",rodando,`${DB.celulares.length} aparelhos cadastrados`)}
      ${stat("layers","Ofertas ativas",DB.ofertas.length,`em ${DB.bms.length} BMs`)}
      ${stat("clock","Chips em alerta",chipAlerta,chipAlerta?"14+ dias sem recarga":"tudo em dia",chipAlerta?"--crit":"--good")}
    </div>

    <div class="grid" style="grid-template-columns:1.35fr 1fr;align-items:start;gap:22px">
      <div class="card" style="padding:20px 22px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px"><h2 style="font-size:15px;font-weight:600">Funil de criativos</h2><span class="tag">${c.length} no total</span></div>
        ${byStage.map(({e,n})=>`
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:13px">
            <div style="width:96px;font-size:12.5px;color:var(--text-2);font-weight:500">${e.nome}</div>
            <div style="flex:1;height:9px;background:var(--surface-2);border-radius:5px;overflow:hidden">
              <div style="height:100%;width:${Math.max(n?6:0,n/totalC*100)}%;background:var(${e.cor});border-radius:5px"></div>
            </div>
            <div class="mono" style="width:26px;text-align:right;font-weight:600">${n}</div>
          </div>`).join("")}
      </div>

      <div class="card" style="padding:20px 22px">
        <h2 style="font-size:15px;font-weight:600;margin-bottom:16px">Recarga dos chips</h2>
        ${chipsSort.length?chipsSort.map(k=>{const d=daysBetween(k.ultimaRecargaEm);const col=d>=14?"--crit":d>=7?"--warn":"--good";return `
          <div style="display:flex;align-items:center;gap:11px;margin-bottom:13px">
            <span class="pill" style="color:var(${col});background:color-mix(in srgb,var(${col}) 15%,transparent);min-width:74px;justify-content:center"><span class="dot"></span>${d}d</span>
            <div style="flex:1;min-width:0"><div class="mono" style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(k.numero)}</div><div style="font-size:11px;color:var(--text-3)">${esc(k.operadora)} · ${celName(k.celularId)||"sem celular"}</div></div>
          </div>`;}).join(""):`<p style="color:var(--text-3);font-size:13px">Nenhum chip cadastrado.</p>`}
      </div>
    </div>

    <div class="sect-h"><h2>Criativos recentes</h2><div class="line"></div></div>
    <div class="tblwrap"><table><thead><tr><th>Criativo</th><th>Oferta</th><th>Estágio</th><th>Celular</th><th>Criado</th></tr></thead><tbody>
      ${recent.map(x=>{const of=byId(DB.ofertas,x.ofertaId);return `<tr style="cursor:pointer" data-open-of="${x.ofertaId}">
        <td><div class="nm">${esc(x.nome)}</div>${x.formato?`<div class="sub2">${esc(x.formato)}</div>`:""}</td>
        <td>${of?esc(of.nome):"—"}</td><td>${stagePill(x.estagio)}</td>
        <td>${x.celularId?`<span class="tag">${esc(celName(x.celularId)||"?")}</span>`:'<span style="color:var(--text-3)">—</span>'}</td>
        <td class="mono" style="color:var(--text-2)">${ago(x.criadoEm)}</td></tr>`;}).join("")}
    </tbody></table></div>`;

function kpiTile(ico,k,v,foot,col){return `<div class="stat"><div class="k">${svg(ico)}${k}</div><div class="v" style="font-size:23px${col?`;color:var(${col})`:""}">${v}</div><div class="foot">${foot}</div></div>`;}
function phonesSection(of){
  const assigned=DB.celulares.filter(c=>c.ofertaId===of.id);

    const runs=DB.criativos.filter(x=>x.celularId===c.id&&x.ofertaId===of.id).length;
    const chip=byId(DB.chips,c.chipId);
    return `<div class="card phonecard">
      <div class="ph-top">${svg("phone")}<div class="ph-i"><b>${esc(c.nome)}</b><span>${esc(c.modelo||"—")}${chip?" · "+esc(chip.numero):""}</span></div>${statusPill(CEL_STATUS,c.status)}</div>
      <div class="ph-foot"><span>${runs} criativo${runs!==1?"s":""} rodando aqui</span><div style="display:flex;gap:2px"><button class="iconbtn" data-editcel="${c.id}" title="Editar">${svg("edit")}</button><button class="iconbtn" data-unassign="${c.id}" title="Tirar da oferta">${svg("trash")}</button></div></div>

  };

    <div class="grid phonesgrid">${assigned.map(card).join("")}${free.map(freeCard).join("")}${empty}</div>`;
}
function stageSelect(c){
  return `<select class="ministage" data-stage="${c.id}" style="color:var(${ESTG[c.estagio].cor})">${ESTAGIOS.map(e=>`<option value="${e.id}" ${e.id===c.estagio?"selected":""}>${e.nome}</option>`).join("")}</select>`;
}
function cCard(c){
  const canNext=NEXT[c.estagio];
  return `<div class="ccard" draggable="true" data-id="${c.id}" style="border-top-color:var(${ESTG[c.estagio].cor})">
    <div class="cname">${esc(c.nome)}</div>
    <div class="cmeta">${c.formato?`<span class="tag">${svgInline("film")}${esc(c.formato)}</span>`:""}${c.campanha?`<span class="tag">${esc(c.campanha)}</span>`:""}</div>

      ${canNext?`<button class="nextbtn" data-next="${c.id}" title="Avançar para ${ESTG[canNext].nome}">Avançar ↗</button>`:""}</div>

function svgInline(k){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" style="width:11px;height:11px;vertical-align:-1px;margin-right:3px">${I[k]}</svg>`;}

let dragId=null;
function setupDnD(){
  $("#view").querySelectorAll(".ccard").forEach(card=>{
    card.addEventListener("dragstart",e=>{dragId=card.dataset.id;card._dragging=true;card.classList.add("drag");e.dataTransfer.effectAllowed="move";});
    card.addEventListener("dragend",()=>{card.classList.remove("drag");setTimeout(()=>card._dragging=false,50);dragId=null;$("#view").querySelectorAll(".col").forEach(c=>c.classList.remove("drop"));});
  });
  $("#view").querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("drop");});
    col.addEventListener("dragleave",e=>{if(!col.contains(e.relatedTarget))col.classList.remove("drop");});
    col.addEventListener("drop",e=>{e.preventDefault();col.classList.remove("drop");if(!dragId)return;const c=byId(DB.criativos,dragId);const st=col.dataset.col;if(c&&c.estagio!==st){c.estagio=st;save();render();toast(`Movido para ${ESTG[st].nome}`);}});
  });
}

/* ---------- modal engine ---------- */
function modal({title,ico,body,okText="Salvar",onOk,wide}){
  const root=$("#modal-root");
  root.innerHTML=`<div class="overlay"><div class="modal" ${wide?'style="max-width:600px"':""}>
    <div class="modal-h">${ico?`<div class="stat" style="width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:11px">${svg(ico)}</div>`:""}<h3>${title}</h3><div class="sp"></div><button class="iconbtn" data-x style="font-size:16px">✕</button></div>
    <div class="modal-b">${body}</div>
    <div class="modal-f"><button class="btn" data-x>Cancelar</button><button class="btn pri" data-ok>${okText}</button></div>
  </div></div>`;
  const close=()=>root.innerHTML="";
  root.querySelectorAll("[data-x]").forEach(b=>b.onclick=close);
  root.querySelector(".overlay").onclick=e=>{if(e.target===root.querySelector(".overlay"))close();};
  root.querySelector("[data-ok]").onclick=()=>{if(onOk(close)!==false){}};
  const first=root.querySelector("input,select,textarea");if(first)first.focus();
  document.onkeydown=e=>{if(e.key==="Escape")close();};
  return {root,close};
}
const val=(root,name)=>root.querySelector(`[name="${name}"]`)?.value.trim()||"";
function field(label,name,value="",opt={}){
  const t=opt.type||"text";
  if(t==="textarea")return `<div class="field"><label>${label}</label><textarea name="${name}" placeholder="${opt.ph||""}">${esc(value)}</textarea></div>`;
  if(t==="select")return `<div class="field"><label>${label}</label><select name="${name}">${opt.options.map(o=>`<option value="${o.v}" ${o.v===value?"selected":""}>${esc(o.l)}</option>`).join("")}</select></div>`;
  return `<div class="field"><label>${label}${opt.optional?' <span class="opt">(opcional)</span>':""}</label><input name="${name}" type="${t}" value="${esc(value)}" placeholder="${opt.ph||""}"></div>`;
}

let fbDoc=null,fbUser=null,cloudOn=false,pushT=null;
const cloudEnabled=()=>!!FIREBASE_CONFIG.apiKey;

function initCloud(){
  const gb=$("#gatebtn");if(gb)gb.onclick=signIn;
  if(!cloudEnabled()){renderAccount();return;}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth(),fs=firebase.firestore();
    auth.onAuthStateChanged(u=>{
      fbUser=u;
      if(u){
        gate(false);
        fbDoc=fs.collection("users").doc(u.uid).collection("app").doc("central");
        syncBadge("sync");renderAccount();
        fbDoc.onSnapshot(snap=>{
          if(snap.metadata.hasPendingWrites){syncBadge("ok");return;}
          if(snap.exists&&snap.data().payload){
            try{DB=normalize(JSON.parse(snap.data().payload));}catch(e){}
            saveLocal();if(!$("#modal-root").innerHTML)render();
          }else{pushCloud();}
          cloudOn=true;syncBadge("ok");
        },e=>{syncBadge("err");});
      }else{fbDoc=null;cloudOn=false;gate(true);renderAccount();}
    });
  }catch(e){renderAccount();}
}
function pushCloud(){if(!fbDoc)return;syncBadge("sync");fbDoc.set({payload:JSON.stringify(DB),updatedAt:Date.now()}).then(()=>syncBadge("ok")).catch(()=>syncBadge("err"));}

  if(fbUser){
    const nm=fbUser.displayName||fbUser.email||"Conta";
    el.innerHTML=`<div class="acctbox"><div class="ava">${esc(nm[0].toUpperCase())}</div><div class="ai"><b>${esc(nm)}</b><span id="syncbadge"></span></div><button class="iconbtn" id="signout" title="Sair">${svg("refresh")}</button></div>`;
    $("#signout").onclick=signOutCloud;syncBadge(cloudOn?"ok":"sync");
  }else{
    el.innerHTML=`<button class="btn pri" id="signin" style="width:100%;justify-content:center;margin-bottom:8px">Entrar com Google</button>`;
    $("#signin").onclick=signIn;
  }
}

initTheme();
render();
initCloud();
</script>
</body>
